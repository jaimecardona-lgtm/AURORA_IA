name: CI

# Integración continua de AURORA AI.
# No usa secretos, no contacta con Supabase ni con OpenRouter y no despliega nada.
# Las pruebas de integración real (Playwright con sesiones de Supabase) son manuales y no se ejecutan aquí.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest y CLI del SENA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias fijadas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pytest
        run: python -m pytest -q

      - name: CLI del SENA · calificaciones
        run: python sena_cli/calificaciones.py 4.5 3.0 2.9

      - name: CLI del SENA · presupuesto
        run: python sena_cli/presupuesto.py --ingreso 2000000 --ahorro 300000 --gasto "Arriendo:600000:fijo" --gasto "Mercado:250000:variable"

      - name: CLI del SENA · tareas
        run: python sena_cli/tareas.py "Entregar AA2:1" "Leer guia:3:completada" "Revisar correo:2"

  frontend:
    name: Frontend · TypeScript y build de Vite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias desde el lockfile
        run: npm ci

      - name: Validación TypeScript estricta
        run: npm run typecheck

      - name: Build de producción con Vite
        run: npm run build

  docker:
    name: Docker · imagen unificada
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construir imagen de producción sin credenciales
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: aurora-ai:ci
          build-args: |
            VITE_SUPABASE_URL=https://proyecto-ficticio.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_clave_ficticia
            VITE_API_BASE_URL=
      - name: Smoke test de imagen compilada (sin acceso a Supabase)
        run: |
          set -euo pipefail
          docker run -d --name aurora-ci -p 127.0.0.1:18000:8000 \
            -e APP_ENV=production \
            -e PERSISTENCE_BACKEND=supabase \
            -e DEMO_MODE=false \
            -e SUPABASE_URL=https://proyecto-ficticio.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_clave_ficticia \
            -e COPILOT_PROVIDER=openrouter \
            aurora-ai:ci
          trap 'docker logs aurora-ci; docker rm -f aurora-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/health -o /tmp/aurora-health.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/aurora-health.json", encoding="utf-8"))
          assert result["status"] == "ok", result
          assert result["supabase_configurado"] is True, result
          PY
          curl -fsS http://127.0.0.1:18000/api/modo | python3 -c 'import json,sys; o=json.load(sys.stdin); assert o["modo"]=="produccion" and o["persistencia"]=="supabase", o'
          curl -fsS http://127.0.0.1:18000/ -o /tmp/aurora-index.html
          grep -q 'assets/index-' /tmp/aurora-index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/api/subjects)" = "401"
          echo "Docker smoke aprobado: SPA, salud, modo seguro y API protegida."
